<nav class="navbar navbar-expand-lg app-navbar">
  <!-- Row 1: logo + bell + user -->
  <div class="container-fluid px-4 d-flex align-items-center justify-content-between topbar-row">
    <div class="d-flex align-items-center gap-4 topbar-left">
      <a class="navbar-brand d-flex align-items-center m-0" routerLink="/app/dashboard">
        <img src="assets/logo.png" alt="Z7i Logo" width="160" height="40" loading="lazy" decoding="async"
          style="height: 40px; width: 160px" />
      </a>

      <app-bredcrump class="d-none d-lg-block"></app-bredcrump>
    </div>

    <!-- Mobile toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
      aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="d-none d-lg-flex align-items-center">
      <div class="position-relative topbar-search me-3">
        <i class="fas fa-search topbar-search-icon"></i>
        <input type="text" class="form-control topbar-search-input" placeholder="Search…"
          [(ngModel)]="globalSearchText" />
      </div>

      <button type="button" class="btn btn-icon position-relative me-2" (click)="toggleNotifPanel()"
        aria-label="Notifications">
        <i class="fa-regular fa-bell"></i>
        <span class="badge rounded-pill notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount
          }}</span>
      </button>

      <div class="dropdown">
        <button class="btn btn-user dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          <span class="user-name d-none d-md-inline">{{username}}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li class="dropdown-header small text-muted">
            Logged in as <strong>{{username}}</strong>
          </li>
          <li class="dropdown-header small text-muted">
            <strong>{{email}}</strong>
          </li>
          <li>
            <a href="https://academic.z7i.in/help" target="_blank" rel="noopener noreferrer"
              class="dropdown-item">
              <i class="fa-regular fa-circle-question me-2"></i> Help Center
            </a>
          </li>
          <li>
            <hr class="dropdown-divider" />
          </li>
          <li>
            <button type="button" class="dropdown-item text-danger" (click)="logout()">
              <i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Row 2: nav tabs -->
  <div class="collapse navbar-collapse tabs-row" id="mainNavbar">
    <div class="container-fluid px-4">
      <ul class="navbar-nav mb-2 mb-lg-0 nav-tabs-brand">
        <li class="nav-item">
          <a class="nav-link" routerLink="/app/dashboard" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
            Dashboard
          </a>
        </li>

        <li class="nav-item" *ngFor="let mod of visibleModules">
          <a class="nav-link" role="button" [class.active]="activeModuleKey === mod.key" (click)="onModuleClick(mod)">
            {{ mod.label }}
          </a>
        </li>
      </ul>

      <!-- Bell + user, mobile only (row 1 hides them below lg) -->
      <div class="d-flex d-lg-none align-items-center gap-2 pb-2">
        <button type="button" class="btn btn-icon position-relative" (click)="toggleNotifPanel()"
          aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
          <span class="badge rounded-pill notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount
            }}</span>
        </button>
        <div class="dropdown">
          <button class="btn btn-user dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            <span class="user-name">{{username}}</span>
          </button>
          <ul class="dropdown-menu">
            <li class="dropdown-header small text-muted">
              Logged in as <strong>{{username}}</strong>
            </li>
            <li>
              <button type="button" class="dropdown-item text-danger" (click)="logout()">
                <i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Contextual sub-nav for the active module -->
<div class="subnav-bar" *ngIf="activeModule as mod">
  <a class="subnav-link" *ngFor="let link of visibleLinks(mod)" [routerLink]="link.path"
    [queryParams]="link.queryParams || null" routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: link.path === '/app/admissions' }">
    {{ link.label }}
  </a>
</div>

<!-- Notification side panel -->
<div class="notif-overlay" *ngIf="notifPanelOpen" (click)="closeNotifPanel()"></div>
<div class="notif-panel" [class.notif-panel-open]="notifPanelOpen">
  <div class="notif-panel-header">
    <h6 class="mb-0">Notifications</h6>
    <div class="d-flex align-items-center">
      <button type="button" class="btn btn-link btn-sm text-decoration-none" (click)="markAllRead()"
        *ngIf="notifications.length">
        Mark all as read
      </button>
      <button type="button" class="btn-close ms-2" aria-label="Close" (click)="closeNotifPanel()"></button>
    </div>
  </div>

  <div class="notif-panel-body">
    <div class="text-center text-muted py-4" *ngIf="notifLoading">
      <i class="fa-solid fa-spinner fa-spin"></i> Loading...
    </div>

    <div class="text-center text-muted py-4" *ngIf="!notifLoading && !notifications.length">
      No notifications
    </div>

    <div class="notif-item" *ngFor="let notif of notifications" [class.notif-item-unread]="!notif.isRead"
      (click)="onNotificationClick(notif)">
      <div class="notif-item-main">
        <div class="notif-item-title">{{ notif.title }}</div>
        <div class="notif-item-body">{{ notif.body }}</div>
        <div class="notif-item-time">{{ notif.createdAt | date: 'dd MMM y, h:mm a' }}</div>
      </div>
      <div class="notif-item-actions">
        <button type="button" class="btn btn-sm btn-link p-0" title="Mark as read" *ngIf="!notif.isRead"
          (click)="toggleRead(notif, $event)">
          <i class="fa-regular fa-circle-dot"></i>
        </button>
        <button type="button" class="btn btn-sm btn-link p-0 text-muted" title="Dismiss"
          (click)="dismissNotification(notif, $event)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>
</div>
