<div class="toast-container" *ngIf="alert">
  <div class="toast" [ngClass]="alert.type">
    <div class="icon">
      <span *ngIf="alert.type === 'success'">✔</span>
      <span *ngIf="alert.type === 'danger'">✖</span>
      <span *ngIf="alert.type === 'warning'">⚠</span>
    </div>

    <div class="message">
      {{ alert.text }}
    </div>

    <button class="close-btn" (click)="close()">×</button>

    <div
      class="progress"
      [style.animationDuration.ms]="alert.timeout || 2000">
    </div>
  </div>
</div>
