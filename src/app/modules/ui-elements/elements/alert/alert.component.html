<div
  *ngIf="alert"
  [ngClass]="{
    alert: true,
    'alert-subtle-success': alert.type === 'success',
    'alert-subtle-danger': alert.type === 'danger',
    'alert-subtle-warning': alert.type === 'warning',
    'custom-alert': true
  }"
  role="alert"
  style="position: fixed; top: 24px; right: 24px; z-index: 9999; width: auto; min-width: 150px; max-width: 500px; padding: 6px 16px"
>
  <span>{{ alert.text }}</span>
  <button type="button" class="btn-close float-end" aria-label="Close" (click)="close()" style="font-size: 0.8em; margin-left: 10px; margin-top: 2px"></button>
</div>
