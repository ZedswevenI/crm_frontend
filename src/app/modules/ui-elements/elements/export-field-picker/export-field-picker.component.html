<div class="app-modal-backdrop" *ngIf="visible">
    <div class="app-modal export-field-modal">
        <div class="app-modal-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0">{{ title }}</h6>
            <button type="button" class="btn-close" (click)="close()"></button>
        </div>

        <div class="app-modal-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted small">{{ selectedCount }} field(s) selected</span>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-link p-0" (click)="selectAll()">Select all</button>
                    <button type="button" class="btn btn-sm btn-link p-0 text-muted" (click)="clearAll()">Clear
                        all</button>
                </div>
            </div>

            <div class="export-field-group" *ngFor="let group of groups">
                <div class="export-field-group-header">
                    <label class="form-check d-flex align-items-center gap-2 mb-0">
                        <input type="checkbox" class="form-check-input"
                            [checked]="isGroupFullyChecked(group)"
                            [indeterminate]="isGroupPartiallyChecked(group)"
                            (change)="toggleGroup(group)" />
                        <span class="fw-semibold">{{ group.title }}</span>
                    </label>
                </div>
                <div class="export-field-list">
                    <label class="form-check d-flex align-items-center gap-2" *ngFor="let field of group.fields"
                        [class.export-field-locked]="field.locked">
                        <input type="checkbox" class="form-check-input" [checked]="isChecked(field.key)"
                            [disabled]="field.locked" (change)="toggleField(field)" />
                        <span>{{ field.label }}</span>
                        <span class="export-field-locked-badge" *ngIf="field.locked">always included</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="export-field-footer d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="close()">
                Cancel
            </button>
            <button type="button" class="btn btn-saffron btn-sm" [disabled]="!selectedCount || exporting"
                (click)="confirmExport()">
                <span *ngIf="exporting" class="spinner-border spinner-border-sm me-1"></span>
                <i class="fa-solid fa-file-excel me-1" *ngIf="!exporting"></i>
                Export to Excel
            </button>
        </div>
    </div>
</div>
