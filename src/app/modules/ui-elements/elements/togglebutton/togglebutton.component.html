<div class="d-flex align-items-center mb-3">
  <span class="me-2">{{ leftLabel }}</span>
  <div class="form-check form-switch mb-0">
    <input type="checkbox" autofocus class="form-check-input" [checked]="value" (change)="onToggleChange($event)" (blur)="onTouched()" [id]="id" />
  </div>
  <span class="ms-2">{{ rightLabel }}</span>
</div>
<div *ngIf="control && control.invalid && (control.touched || control.dirty)">
  <small class="text-danger" *ngIf="control.errors?.['required']">This field is required.</small>
  <small class="text-danger" *ngIf="control.errors?.['requiredTrue']">You must enable this toggle.</small>
</div>
