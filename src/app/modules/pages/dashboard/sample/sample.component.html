<h2>Ui Elements</h2>

<form [formGroup]="form" class="pb-5">
    <p class="mt-3"><strong>Form Value:</strong> {{ form.value | json }}</p>
    <h4 class="mt-3">Formfield</h4>
    <div class="col-md-4">
        <formfield label="Formfield " [control]="form.get('location')" formControlName="location"
            [placeholder]="'Enter Name'" [required]="true">
        </formfield>
    </div>

    <h4 class="mt-2">Selectbox</h4>
    <div class="col-md-4">
        <selectbox label="Selectbox" [options]="field_options" formControlName="type" [required]="true"
            [control]="form.get('type')"> </selectbox>
    </div>

    <h4 class="mt-2">Checkbox</h4>
    <div class="col-md-4">
        <checkbox label="Checkbox" class="" [required]="false" [control]="form.get('check')" formControlName="check">
        </checkbox>
    </div>

    <h4 class="mt-2">MultiSelect</h4>
    <div class="col-md-4">
        <multiselect label="MultiSelect" placeholder="Choose options" [options]="field_options2"
            formControlName="selectedFields" [control]="form.get('selectedFields')" [required]="true">
        </multiselect>
    </div>

    <h4 class="mt-2">RadioButton</h4>
    <div class="col-md-4">
        <radiobutton class="" label="Gender" [required]="true" [options]="radioOptions" formControlName="gender"
            [control]="form.get('gender')"></radiobutton>
    </div>

    <h4 class="mt-2">Autocomplete</h4>
    <div class="col-md-4">
        <autocomplete label="Country" placeholder="Select Country" [required]="true" [options]="countries"
            optionLabel="name" optionValue="id" formControlName="country" [control]="form.get('country')">
        </autocomplete>
    </div>

    <h4 class="mt-2">HTML Editor</h4>
    <div class="col-md-6">
        <doceditor label="" [required]="true" placeholder="Specification to Content" [control]="form.get('specific')"
            formControlName="specific" id="specific">
        </doceditor>
    </div>

    <h4 class="mt-2">ToggleButton</h4>
    <div class="col-md-4">
        <togglebtn class="" rightLabel="Yes" leftLabel="No" [required]="false" [control]="form.get('conform')"
            formControlName="conform" id="toggleActive"></togglebtn>
    </div>

    <h4 class="mt-2">Description</h4>
    <div class="col-md-4">
        <description label="" placeholder="Add description about permit type" [control]="form.get('desc')"
            formControlName="desc" [required]="false"></description>
    </div>

    <h4 class="mt-2">Importfile</h4>
    <div class="col-md-4">
        <importfiles label="" [required]="false" [multiple]="true" accept="" [control]="form.get('file')"
            formControlName="file" (filesChanged)="onFilesSelected($event)"></importfiles>
    </div>

    <h4 class="mt-2">Taginput</h4>
    <div class="col-md-4">
        <taginput label="" [placeholder]="'Enter Skills'" formControlName="skills" [control]="form.get('skills')"
            [required]="true"></taginput>
    </div>

    <h4 class="mt-2">Common Delete</h4>
    <div class="col-md-4">
        <delete [title]="'Delete Record'" [message]="'Are you sure you want to delete this record?'"
            [(visible)]="modalVisible" (closed)="onModalClosed($event)">
        </delete>
        <button class="btn btn-primary" (click)="openModal()">Open Modal</button>
    </div>

    <h4 class="mt-2">Alert</h4>
    <div class="col-md-4">
        <button class="btn btn-success me-2" (click)="showSuccess()">Success</button>
        <button class="btn btn-danger me-2" (click)="showError()">Error</button>
        <button class="btn btn-warning" (click)="showWarning()">Warning</button>
    </div>

</form>
