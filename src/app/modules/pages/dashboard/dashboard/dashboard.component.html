<div class="dashboard-page">
    <!-- QUICK ACTIONS -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-body d-flex gap-2 flex-wrap">
            <button class="btn btn-saffron" (click)="go('/app/admissions/new')">
                <i class="fa-solid fa-user-plus me-1"></i> New Admission
            </button>
            <button class="btn btn-outline-primary" (click)="go('/app/exams/marks-entry/EX-001')">
                <i class="fa-solid fa-pen-ruler me-1"></i> Marks Entry
            </button>
            <button class="btn btn-outline-success" (click)="go('/app/attendance/entry')">
                <i class="fa-solid fa-calendar-check me-1"></i> Attendance
            </button>
            <button class="btn btn-outline-secondary" (click)="go('/app/fees/collection')">
                <i class="fa-solid fa-indian-rupee-sign me-1"></i> Fee Collection
            </button>
        </div>
    </div>
    <!-- KPI ROW -->
    <div class="row g-3 mb-3">
        <div class="col-xl-2 col-md-4 col-sm-6" *ngFor="let k of kpis">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="text-muted small">{{ k.label }}</div>
                    <div class="fw-bold fs-4">{{ k.value }}</div>
                    <div class="small text-muted mt-1">{{ k.sub }}</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHARTS -->
    <div class="row g-3">

        <!-- Performance Trend -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white border-0">
                    <h6 class="mb-0 fw-semibold">Performance Trend</h6>
                    <small class="text-muted">Average % across exams</small>
                </div>
                <div class="card-body">
                    <canvas id="performanceTrend"></canvas>
                </div>
            </div>
        </div>

        <!-- Attendance Trend -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white border-0">
                    <h6 class="mb-0 fw-semibold">Attendance %</h6>
                    <small class="text-muted">Last 7 days</small>
                </div>
                <div class="card-body">
                    <canvas id="attendanceTrend"></canvas>
                </div>
            </div>
        </div>

        <!-- Subject Comparison -->
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white border-0">
                    <h6 class="mb-0 fw-semibold">Subject-wise Average</h6>
                </div>
                <div class="card-body">
                    <canvas id="subjectComparison"></canvas>
                </div>
            </div>
        </div>

        <!-- Fee Collection -->
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white border-0">
                    <h6 class="mb-0 fw-semibold">Fee Collection Split</h6>
                </div>
                <div class="card-body">
                    <canvas id="feeSplit"></canvas>
                </div>
            </div>
        </div>

    </div>

</div>
