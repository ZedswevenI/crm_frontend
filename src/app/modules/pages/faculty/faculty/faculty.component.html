<div class="faculty-page">

    <!-- List Card -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h5 class="mb-1 fw-semibold">Faculty Assignment</h5>
                <p class="mb-0 text-muted small">
                    Assign faculty to batches, subjects and class schedule.
                </p>
            </div>

            <button class="btn btn-sm btn-saffron d-flex align-items-center gap-1" (click)="openAssign()">
                <i class="fa-solid fa-plus"></i>
                <span>Assign Faculty</span>
            </button>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="assignments" [actions]="actions">
            </list-table>
        </div>
    </div>

    <!-- ASSIGN MODAL -->
    <div class="app-modal-backdrop" *ngIf="showAssign">
        <div class="app-modal faculty-modal">

            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">{{ editId ? 'Edit Assignment' : 'Assign Faculty' }}</h6>
                    <span class="text-muted small">Map faculty → batch → subject → schedule</span>
                </div>
                <button type="button" class="btn-close" (click)="closeAssign()"></button>
            </div>

            <div class="app-modal-body">
                <form [formGroup]="form" (ngSubmit)="save()">
                    <div class="row g-3">

                        <div class="col-md-4">
                            <selectbox label="Faculty" [required]="true" [options]="facultyOptions"
                                [optionLabel]="'label'" [optionValue]="'value'" [control]="form.get('facultyId')"
                                formControlName="facultyId">
                            </selectbox>
                        </div>

                        <div class="col-md-4">
                            <selectbox label="Batch" [required]="true" [options]="batchOptions" [optionLabel]="'label'"
                                [optionValue]="'value'" [control]="form.get('batchId')" formControlName="batchId">
                            </selectbox>
                        </div>

                        <div class="col-md-4">
                            <selectbox label="Subject" [required]="true" [options]="subjectOptions"
                                [optionLabel]="'label'" [optionValue]="'value'" [control]="form.get('subjectId')"
                                formControlName="subjectId">
                            </selectbox>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">Day</label>
                            <select class="form-select" formControlName="day">
                                <option *ngFor="let d of days" [value]="d">{{ d }}</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">Start Time</label>
                            <input class="form-control" type="time" formControlName="startTime"
                                [class.is-invalid]="form.get('startTime')?.touched && form.get('startTime')?.invalid" />
                            <div class="invalid-feedback">Required</div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">End Time</label>
                            <input class="form-control" type="time" formControlName="endTime"
                                [class.is-invalid]="form.get('endTime')?.touched && form.get('endTime')?.invalid" />
                            <div class="invalid-feedback">Required</div>
                        </div>

                        <div class="col-md-3 d-flex align-items-end">
                            <checkbox label="Active" [control]="form.get('isActive')" formControlName="isActive">
                            </checkbox>
                        </div>

                        <div class="col-12">
                            <div class="alert alert-light small mb-0">
                                Note: In real workflow, you can also validate conflicts (same faculty same time).
                            </div>
                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="closeAssign()">Cancel</button>
                        <button type="submit" class="btn btn-saffron" [disabled]="form.invalid">
                            {{ editId ? 'Update' : 'Assign' }}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- Delete Confirmation (reuse your delete component if exists) -->
    <delete [title]="'Delete Assignment'" [message]="deleteMessage" [(visible)]="deleteModalVisible"
        (closed)="onDeleteModalClosed($event)">
    </delete>

</div>
