<div class="exam-page">

    <!-- List Card -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h5 class="mb-1 fw-semibold">Exam Setup</h5>
                <p class="mb-0 text-muted small">
                    Create exams, map to batch/program, and publish schedule.
                </p>
            </div>

            <div class="d-flex gap-2 align-items-center flex-wrap">
                <div style="min-width: 260px;">
                    <input class="form-control form-control-sm" placeholder="Search by Exam / Code / Batch"
                        [(ngModel)]="search" [ngModelOptions]="{ standalone: true }" (input)="applyFilter()" />
                </div>

                <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" (click)="reload()">
                    <i class="fa-solid fa-rotate"></i><span>Refresh</span>
                </button>

                <button class="btn btn-sm btn-saffron d-flex align-items-center gap-1" (click)="add()">
                    <i class="fa-solid fa-plus"></i><span>Add Exam</span>
                </button>
            </div>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="filtered" [actions]="actions">
            </list-table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="app-modal-backdrop" *ngIf="showForm">
        <div class="app-modal exam-modal">

            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">{{ mode === 'create' ? 'Create Exam' : 'Edit Exam' }}</h6>
                    <span class="text-muted small">
                        {{ mode === 'create' ? 'Define exam details and schedule.' : 'Update exam details.' }}
                    </span>
                </div>
                <button type="button" class="btn-close" (click)="closeForm()"></button>
            </div>

            <div class="app-modal-body">
                <form [formGroup]="form" (ngSubmit)="save()">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <formfield label="Exam Name" [required]="true" formControlName="name"
                                [control]="form.get('name')" placeholder="Unit Test - Physics 01">
                            </formfield>
                        </div>

                        <div class="col-md-3">
                            <formfield label="Exam Code" [required]="true" formControlName="code"
                                [control]="form.get('code')" placeholder="UT-PHY-01">
                            </formfield>
                        </div>

                        <div class="col-md-5">
                            <selectbox label="Program" [required]="true" [options]="programOptions"
                                [optionLabel]="'label'" [optionValue]="'value'" formControlName="programId"
                                [control]="form.get('programId')">
                            </selectbox>
                        </div>

                        <div class="col-md-5">
                            <selectbox label="Batch" [required]="true" [options]="batchOptions" [optionLabel]="'label'"
                                [optionValue]="'value'" formControlName="batchId" [control]="form.get('batchId')">
                            </selectbox>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">Exam Type</label>
                            <select class="form-select" formControlName="examType">
                                <option value="weekly">Weekly Test</option>
                                <option value="unit">Unit Test</option>
                                <option value="model">Model Exam</option>
                                <option value="scholarship">Scholarship Test</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small text-muted">Mode</label>
                            <select class="form-select" formControlName="mode">
                                <option value="offline">Offline</option>
                                <option value="online">Online</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">Start Date & Time</label>
                            <input class="form-control" type="datetime-local" formControlName="startAt"
                                [class.is-invalid]="f('startAt').touched && f('startAt').invalid" />
                            <div class="invalid-feedback">Required</div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">End Date & Time</label>
                            <input class="form-control" type="datetime-local" formControlName="endAt"
                                [class.is-invalid]="f('endAt').touched && f('endAt').invalid" />
                            <div class="invalid-feedback">Required</div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">Status</label>
                            <select class="form-select" formControlName="status">
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                            </select>
                        </div>

                        <div class="col-md-3 d-flex align-items-center">
                            <checkbox label="Active" formControlName="isActive" [control]="form.get('isActive')">
                            </checkbox>
                        </div>

                        <div class="col-12">
                            <label class="form-label small text-muted">Remarks</label>
                            <input class="form-control" formControlName="remarks" placeholder="Optional notes" />
                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="closeForm()">Cancel</button>
                        <button type="submit" class="btn btn-saffron" [disabled]="form.invalid">
                            {{ mode === 'create' ? 'Save Exam' : 'Update Exam' }}
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <!-- Delete Confirmation -->
    <delete [title]="'Delete Exam'" [message]="deleteMessage" [(visible)]="deleteModalVisible"
        (closed)="onDeleteModalClosed($event)">
    </delete>

</div>
