<div class="enrollment-page">

    <!-- List Card -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 fw-semibold">Student Enrollment</h5>
                <p class="mb-0 text-muted small">
                    Enroll students into batches and manage batch assignments.
                </p>
            </div>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="students" [actions]="actions">
            </list-table>
        </div>
    </div>

    <!-- ENROLL MODAL -->
    <div class="app-modal-backdrop" *ngIf="showEnroll">
        <div class="app-modal enrollment-modal">

            <!-- Header -->
            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">Enroll Student</h6>
                    <span class="text-muted small">
                        {{ selected?.name }} • {{ selected?.regNo }}
                    </span>
                </div>
                <button class="btn-close" (click)="closeEnroll()"></button>
            </div>

            <!-- Body -->
            <div class="app-modal-body">
                <form [formGroup]="enrollForm" (ngSubmit)="confirmEnroll()">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <formfield label="Program" [control]="enrollForm.get('program')" formControlName="program"
                                [required]="true">
                            </formfield>
                        </div>

                        <div class="col-md-6">
                            <formfield label="Centre" [control]="enrollForm.get('center')" formControlName="center"
                                [required]="true">
                            </formfield>
                        </div>

                        <div class="col-md-12">
                            <selectbox label="Select Batch" [required]="true" [options]="batchOptions"
                                [optionLabel]="'label'" [optionValue]="'value'" [control]="enrollForm.get('batchId')"
                                formControlName="batchId">
                            </selectbox>
                        </div>

                        <div class="col-12">
                            <div class="alert alert-light small mb-0">
                                Student will be officially enrolled into the selected batch.
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="closeEnroll()">Cancel</button>
                        <button type="submit" class="btn btn-saffron" [disabled]="enrollForm.invalid">
                            Confirm Enrollment
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

</div>
