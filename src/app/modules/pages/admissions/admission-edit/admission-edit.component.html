<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
        <div>
            <h6 class="mb-0 fw-semibold">Edit Admission</h6>
            <div class="text-muted small">Allowed only for Rejected / Draft admissions.</div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" (click)="close()">Cancel</button>
            <button class="btn btn-saffron btn-sm" [disabled]="loading" (click)="save()">
                <span *ngIf="!loading">Save Changes</span>
                <span *ngIf="loading">Saving...</span>
            </button>
        </div>
    </div>

    <div class="card-body">
        <div class="row g-3">
            <div class="col-lg-6">
                <div class="fw-semibold mb-2">Student</div>
                <div class="mb-2">
                    <label class="form-label">Student Name *</label>
                    <input class="form-control" formControlName="studentName" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Student Phone *</label>
                    <input class="form-control" formControlName="studentPhone" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Email</label>
                    <input class="form-control" formControlName="studentEmail" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Parent Name</label>
                    <input class="form-control" formControlName="parentName" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Parent Phone</label>
                    <input class="form-control" formControlName="parentPhone" [formGroup]="form" />
                </div>
            </div>

            <div class="col-lg-6">
                <div class="fw-semibold mb-2">Academics</div>
                <div class="mb-2">
                    <label class="form-label">Centre *</label>
                    <input class="form-control" formControlName="centerName" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Program *</label>
                    <input class="form-control" formControlName="programName" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Program Code</label>
                    <input class="form-control" formControlName="programCode" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Batch</label>
                    <input class="form-control" formControlName="batchName" [formGroup]="form" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Class / Timing</label>
                    <input class="form-control" formControlName="classLabel" [formGroup]="form" />
                </div>
            </div>
        </div>
    </div>
</div>
