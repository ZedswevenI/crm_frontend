<div class="admission-page">
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 fw-semibold">Admissions</h5>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1"
                    (click)="openExportPicker()">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>Export</span>
                </button>
                <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" (click)="newAdmission()">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Admission</span>
                </button>
            </div>
        </div>

            <div class="mt-3 p-3">
                <list-table [autoFitChars]="true" [columns]="columns" [data]="admissions" [actions]="actions"
                    [showfilter]="true" [filterLabel]="'Filter Based on:'" [filterOptions]="statusFilterOptions"
                    [selectedFilter]="statusFilter" (filterChange)="onStatusFilterChange($event)" [loading]="loading"
                    [totalRecords]="totalRecords" [(currentPage)]="currentPage" (requestData)="onTable($event)"
                    (change)="onStatusChange()">
                </list-table>
            </div>
        </div>
    </div>
</div>

<export-field-picker [visible]="showExportPicker" title="Export Admissions to Excel" [groups]="exportFieldGroups"
    [exporting]="exportingExcel" (closed)="closeExportPicker()" (exportClick)="onExportFields($event)">
</export-field-picker>
