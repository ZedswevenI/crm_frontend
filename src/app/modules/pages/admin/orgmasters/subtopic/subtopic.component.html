<div class="subtopic-page">
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h5 class="mb-1 fw-semibold">Sub-Topic Master</h5>
                <p class="mb-0 text-muted small">Manage Sub-Topics mapped to Class → Subject → Topic.</p>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" (click)="add()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Sub-Topic</span>
                </button>
            </div>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="tableData" [actions]="actions"
                [showfilter]="false" [loading]="loading" [totalRecords]="totalRecords"
                (requestData)="fetchTableData($event)">
            </list-table>
        </div>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="app-modal-backdrop" *ngIf="showForm">
        <div class="app-modal" style="max-width: 760px;">
            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-semibold">
                    {{ formMode === 'create' ? 'Create Sub-Topic' : 'Edit Sub-Topic' }}
                </h6>
                <button type="button" class="btn-close" (click)="cancel()"></button>
            </div>

            <div class="app-modal-body">
                <form [formGroup]="form" (ngSubmit)="save()">
                    <div class="row g-3">

                        <!-- CLASS -->
                        <div class="col-md-4">
                            <selectbox label="Class" [required]="true" [options]="classOptions" optionLabel="label"
                                optionValue="value" formControlName="classNo" (selectionChange)="loadTopics()">
                            </selectbox>
                        </div>

                        <!-- SUBJECT -->
                        <div class="col-md-4">
                            <selectbox label="Subject" [required]="true" [options]="subjectOptions"
                                optionLabel="subjectName" optionValue="_id" formControlName="subjectId"
                                (selectionChange)="loadTopics()">
                            </selectbox>
                        </div>

                        <!-- TOPIC -->
                        <div class="col-md-4">
                            <selectbox label="Topic" [required]="true" [options]="topicOptions" optionLabel="topicName"
                                optionValue="topicId" formControlName="topicId">
                            </selectbox>
                        </div>

                        <!-- SUB-TOPIC NAME -->
                        <div class="col-md-6">
                            <formfield label="Sub-Topic Name" [required]="true" formControlName="subTopicName"
                                placeholder="Ex: Height & Distance">
                            </formfield>
                        </div>

                        <!-- SUB-TOPIC CODE -->
                        <div class="col-md-3">
                            <formfield label="Code" formControlName="subTopicCode" placeholder="HD01">
                            </formfield>
                        </div>

                        <!-- SORT ORDER -->
                        <div class="col-md-3">
                            <formfield label="Sort Order" formControlName="sortOrder" placeholder="1">
                            </formfield>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
                        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                            {{ formMode === 'create' ? 'Save' : 'Update' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ================= DELETE CONFIRM ================= -->
    <delete [title]="'Delete Sub-Topic'" [message]="deleteMessage" [(visible)]="deleteModalVisible"
        (closed)="onDeleteModalClosed($event)">
    </delete>
</div>
