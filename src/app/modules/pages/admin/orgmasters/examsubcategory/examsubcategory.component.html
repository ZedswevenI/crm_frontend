<div class="exam-subcategory-page">
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 fw-semibold">Exam Sub Category</h5>
                <p class="mb-0 text-muted small">Create and manage exam sub categories (sort order supported).</p>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" (click)="add()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Sub Category</span>
                </button>
            </div>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="tableData" [actions]="actions"
                [showfilter]="false" [loading]="loading" [totalRecords]="totalRecords"
                (requestData)="fetchTableData($event)">
            </list-table>
        </div>
    </div>

    <!-- ================= Create / Edit Modal ================= -->
    <div class="app-modal-backdrop" *ngIf="showForm">
        <div class="app-modal" style="max-width: 920px;">
            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">{{ formMode === 'create' ? 'Create Exam Sub Category' : 'Edit Exam Sub
                        Category' }}</h6>
                    <span class="text-muted small">{{ formMode === 'create' ? 'Add a new sub category' : 'Update sub
                        category details' }}</span>
                </div>
                <button type="button" class="btn-close" (click)="cancel()" aria-label="Close"></button>
            </div>

            <div class="app-modal-body">
                <form [formGroup]="form" (ngSubmit)="save()">
                    <div class="row g-3">

                        <div class="col-md-5">
                            <selectbox label="Category" [required]="true" [options]="categoryOptions"
                                optionLabel="label" optionValue="value" [control]="form.get('categoryId')"
                                formControlName="categoryId">
                            </selectbox>
                        </div>

                        <div class="col-md-4">
                            <formfield label="Sub Category Name" [required]="true"
                                [control]="form.get('subCategoryName')" formControlName="subCategoryName"
                                placeholder="Unit Test - 1">
                            </formfield>
                        </div>

                        <div class="col-md-3">
                            <formfield label="Sort Order" [required]="true" [control]="form.get('sortOrder')"
                                formControlName="sortOrder" placeholder="1">
                            </formfield>
                        </div>

                        <div class="col-md-5">
                            <formfield label="Sub Category Code" [required]="false"
                                [control]="form.get('subCategoryCode')" formControlName="subCategoryCode"
                                placeholder="UT1">
                            </formfield>
                        </div>

                        <div class="col-md-4 d-flex align-items-center">
                            <checkbox label="Active" [control]="form.get('isActive')" formControlName="isActive">
                            </checkbox>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
                        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                            {{ formMode === 'create' ? 'Save' : 'Update' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation -->
    <delete [title]="'Delete Exam Sub Category'" [message]="deleteMessage" [(visible)]="deleteModalVisible"
        (closed)="onDeleteModalClosed($event)">
    </delete>
</div>
