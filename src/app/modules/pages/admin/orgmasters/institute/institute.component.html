<div class="institute-page">

    <!-- List Card -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 fw-semibold">Institute Master</h5>
                <p class="mb-0 text-muted small">
                    Manage institute profiles, codes and primary contact details.
                </p>
            </div>
            <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" (click)="add()">
                <i class="fa-solid fa-plus"></i>
                <span>Add Institute</span>
            </button>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="data" [actions]="actions">
            </list-table>
        </div>
    </div>

    <!-- Create / Edit Modal (custom, Angular-controlled) -->
    <div class="app-modal-backdrop" *ngIf="showForm">
        <div class="app-modal">

            <!-- Modal header -->
            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">
                        {{ formMode === 'create' ? 'Create Institute' : 'Edit Institute' }}
                    </h6>
                    <span class="text-muted small">
                        {{ formMode === 'create'
                        ? 'Add a new institute to the system.'
                        : 'Update institute details.' }}
                    </span>
                </div>
                <button type="button" class="btn-close" (click)="cancel()" aria-label="Close"></button>
            </div>

            <!-- Modal body -->
            <div class="app-modal-body">
                <form [formGroup]="instituteForm" (ngSubmit)="save()">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <formfield label="Institute Name" [required]="true" [control]="instituteForm.get('name')"
                                formControlName="name" placeholder="Enter institute name">
                            </formfield>
                        </div>

                        <div class="col-md-3">
                            <formfield label="Code" [required]="true" [control]="instituteForm.get('code')"
                                formControlName="code" placeholder="Z7I-MAIN">
                            </formfield>
                        </div>

                        <div class="col-md-4">
                            <formfield label="City" [required]="true" [control]="instituteForm.get('city')"
                                formControlName="city" placeholder="Coimbatore">
                            </formfield>
                        </div>

                        <div class="col-md-5">
                            <formfield label="Contact Email" [required]="true"
                                [control]="instituteForm.get('contactEmail')" formControlName="contactEmail"
                                placeholder="info@z7iinstitute.com">
                            </formfield>
                        </div>

                        <div class="col-md-4">
                            <formfield label="Phone" [required]="true" [control]="instituteForm.get('phone')"
                                formControlName="phone" placeholder="10 digit phone">
                            </formfield>
                        </div>

                        <div class="col-md-3 d-flex align-items-center">
                            <checkbox label="Active" [control]="instituteForm.get('isActive')"
                                formControlName="isActive">
                            </checkbox>
                        </div>
                    </div>

                    <!-- Modal footer actions -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary" [disabled]="instituteForm.invalid">
                            {{ formMode === 'create' ? 'Save Institute' : 'Update Institute' }}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <delete [title]="'Delete Institute'" [message]="deleteMessage" [(visible)]="deleteModalVisible"
        (closed)="onDeleteModalClosed($event)">
    </delete>

</div>
