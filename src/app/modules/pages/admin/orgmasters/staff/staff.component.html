<div class="staff-page">

    <!-- List Card -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 fw-semibold">Staff Master</h5>
                <p class="mb-0 text-muted small">
                    Manage faculty, centre heads, counsellors and admin staff.
                </p>
            </div>
            <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" (click)="add()">
                <i class="fa-solid fa-plus"></i>
                <span>Add Staff</span>
            </button>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="staffData" [actions]="actions">
            </list-table>
        </div>
    </div>

    <!-- Create / Edit Modal -->
    <div class="app-modal-backdrop" *ngIf="showForm">
        <div class="app-modal">

            <!-- Modal header -->
            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">
                        {{ formMode === 'create' ? 'Create Staff' : 'Edit Staff' }}
                    </h6>
                    <span class="text-muted small">
                        {{ formMode === 'create'
                        ? 'Add a new staff member to a centre.'
                        : 'Update staff details.' }}
                    </span>
                </div>
                <button type="button" class="btn-close" (click)="cancel()" aria-label="Close"></button>
            </div>

            <!-- Modal body -->
            <div class="app-modal-body">
                <form [formGroup]="staffForm" (ngSubmit)="save()">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <formfield label="Staff Name" [required]="true" [control]="staffForm.get('name')"
                                formControlName="name" placeholder="Enter staff name">
                            </formfield>
                        </div>

                        <div class="col-md-3">
                            <formfield label="Code" [required]="true" [control]="staffForm.get('code')"
                                formControlName="code" placeholder="STF-XXX">
                            </formfield>
                        </div>

                        <div class="col-md-3">
                            <selectbox label="Role" [required]="true" [options]="roleOptions" [optionLabel]="'label'"
                                [optionValue]="'value'" [control]="staffForm.get('role')" formControlName="role">
                            </selectbox>
                        </div>

                        <div class="col-md-4">
                            <selectbox label="Center" [required]="true" [options]="centerOptions"
                                [optionLabel]="'label'" [optionValue]="'value'" [control]="staffForm.get('centerId')"
                                formControlName="centerId">
                            </selectbox>
                        </div>

                        <div class="col-md-3">
                            <formfield label="Phone" [required]="true" [control]="staffForm.get('phone')"
                                formControlName="phone" placeholder="10 digit phone">
                            </formfield>
                        </div>

                        <div class="col-md-4">
                            <formfield label="Email" [required]="true" [control]="staffForm.get('email')"
                                formControlName="email" placeholder="staff@z7i.com">
                            </formfield>
                        </div>

                        <div class="col-md-2 d-flex align-items-center">
                            <checkbox label="Active" [control]="staffForm.get('isActive')" formControlName="isActive">
                            </checkbox>
                        </div>
                    </div>

                    <!-- Modal footer actions -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary" [disabled]="staffForm.invalid">
                            {{ formMode === 'create' ? 'Save Staff' : 'Update Staff' }}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- Delete Confirmation -->
    <delete [title]="'Delete Staff'" [message]="deleteMessage" [(visible)]="deleteModalVisible"
        (closed)="onDeleteModalClosed($event)">
    </delete>

</div>
