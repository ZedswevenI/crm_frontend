<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Staff Master</h5>
        <button class="btn btn-sm btn-primary" (click)="add()">
            <i class="fa-solid fa-plus me-1"></i> Add Staff
        </button>
    </div>
    <div class="card-body">
        <list-table [autoFitChars]="true" [columns]="columns" [data]="staffData" [actions]="actions">
        </list-table>
    </div>
</div>

<div class="card" *ngIf="showForm">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="mb-0">
            {{ formMode === 'create' ? 'Create Staff' : 'Edit Staff' }}
        </h6>
        <button type="button" class="btn-close" (click)="cancel()"></button>
    </div>
    <div class="card-body">
        <form [formGroup]="staffForm" (ngSubmit)="save()">
            <div class="row g-3">
                <div class="col-md-4">
                    <formfield label="Staff Name" [required]="true" [control]="staffForm.get('name')"
                        formControlName="name" placeholder="Enter staff name">
                    </formfield>
                </div>
                <div class="col-md-3">
                    <formfield label="Code" [required]="true" [control]="staffForm.get('code')" formControlName="code"
                        placeholder="STF-XXX">
                    </formfield>
                </div>
                <div class="col-md-3">
                    <selectbox label="Role" [required]="true" [options]="roleOptions" [optionLabel]="'label'"
                        [optionValue]="'value'" [control]="staffForm.get('role')" formControlName="role">
                    </selectbox>
                </div>
                <div class="col-md-4">
                    <selectbox label="Center" [required]="true" [options]="centerOptions" [optionLabel]="'label'"
                        [optionValue]="'value'" [control]="staffForm.get('centerId')" formControlName="centerId">
                    </selectbox>
                </div>
                <div class="col-md-3">
                    <formfield label="Phone" [required]="true" [control]="staffForm.get('phone')"
                        formControlName="phone" placeholder="10 digit phone">
                    </formfield>
                </div>
                <div class="col-md-4">
                    <formfield label="Email" [required]="true" [control]="staffForm.get('email')"
                        formControlName="email" placeholder="staff@z7i.com">
                    </formfield>
                </div>
                <div class="col-md-2 d-flex align-items-center">
                    <checkbox label="Active" [control]="staffForm.get('isActive')" formControlName="isActive">
                    </checkbox>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary me-2" [disabled]="staffForm.invalid">
                    Save
                </button>
                <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
