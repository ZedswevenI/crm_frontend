<div class="center-page">

    <!-- List Card -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 fw-semibold">Center Management</h5>
                <p class="mb-0 text-muted small">
                    Manage centers under each institute with location and status.
                </p>
            </div>
            <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" (click)="add()">
                <i class="fa-solid fa-plus"></i>
                <span>Add Center</span>
            </button>
        </div>

        <div class="card-body pt-0">
            <list-table [autoFitChars]="true" [columns]="columns" [data]="centerData" [actions]="actions">
            </list-table>
        </div>
    </div>

    <!-- Create / Edit Modal -->
    <div class="app-modal-backdrop" *ngIf="showForm">
        <div class="app-modal">

            <!-- Modal header -->
            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">
                        {{ formMode === 'create' ? 'Create Center' : 'Edit Center' }}
                    </h6>
                    <span class="text-muted small">
                        {{ formMode === 'create'
                        ? 'Add a new center under an institute.'
                        : 'Update center details.' }}
                    </span>
                </div>
                <button type="button" class="btn-close" (click)="cancel()" aria-label="Close"></button>
            </div>

            <!-- Modal body -->
            <div class="app-modal-body">
                <form [formGroup]="centerForm" (ngSubmit)="save()">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <formfield label="Center Name" [required]="true" [control]="centerForm.get('name')"
                                formControlName="name" placeholder="Gandhipuram Center">
                            </formfield>
                        </div>

                        <div class="col-md-3">
                            <formfield label="Code" [required]="true" [control]="centerForm.get('code')"
                                formControlName="code" placeholder="CT-GDP">
                            </formfield>
                        </div>

                        <div class="col-md-5">
                            <selectbox label="Institute" [required]="true" [options]="instituteOptions"
                                [optionLabel]="'label'" [optionValue]="'value'"
                                [control]="centerForm.get('instituteId')" formControlName="instituteId">
                            </selectbox>
                        </div>

                        <div class="col-md-4">
                            <formfield label="City" [required]="true" [control]="centerForm.get('city')"
                                formControlName="city" placeholder="City">
                            </formfield>
                        </div>

                        <div class="col-md-4">
                            <formfield label="State" [required]="true" [control]="centerForm.get('state')"
                                formControlName="state" placeholder="State">
                            </formfield>
                        </div>

                        <div class="col-md-3 d-flex align-items-center">
                            <checkbox label="Active" [control]="centerForm.get('isActive')" formControlName="isActive">
                            </checkbox>
                        </div>
                    </div>

                    <!-- Modal footer actions -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary" [disabled]="centerForm.invalid">
                            {{ formMode === 'create' ? 'Save Center' : 'Update Center' }}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- Delete Confirmation -->
    <delete [title]="'Delete Center'" [message]="deleteMessage" [(visible)]="deleteModalVisible"
        (closed)="onDeleteModalClosed($event)">
    </delete>

</div>
