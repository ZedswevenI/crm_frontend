<div class="absentees-page">
    <!-- List Card -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h5 class="mb-1 fw-semibold">Absentees</h5>
                <p class="mb-0 text-muted small">
                    View absentees by date/batch/class and notify parents.
                </p>
            </div>
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <input class="form-control form-control-sm" style="min-width:260px;"
                    placeholder="Search by Reg No / Name / Phone" [(ngModel)]="search"
                    [ngModelOptions]="{ standalone: true }" (input)="applyFilter()" />

                <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" (click)="reload()">
                    <i class="fa-solid fa-rotate"></i><span>Refresh</span>
                </button>
            </div>
        </div>
        <div class="card-body pt-0">
            <!-- Filters -->
            <div class="border rounded-3 p-3 mb-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Date</label>
                        <input type="date" class="form-control form-control-sm" [(ngModel)]="filterDate"
                            [ngModelOptions]="{ standalone: true }" (change)="applyFilter()" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Batch</label>
                        <select class="form-select form-select-sm" [(ngModel)]="filterBatchId"
                            [ngModelOptions]="{ standalone: true }" (change)="applyFilter()">
                            <option value="all">All</option>
                            <option *ngFor="let b of batches" [value]="b.id">{{ b.name }}</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Class</label>
                        <select class="form-select form-select-sm" [(ngModel)]="filterClassId"
                            [ngModelOptions]="{ standalone: true }" (change)="applyFilter()">
                            <option value="all">All</option>
                            <option *ngFor="let c of classOptions" [value]="c.id">
                                {{ c.label }}
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Notify Status</label>
                        <select class="form-select form-select-sm" [(ngModel)]="filterNotified"
                            [ngModelOptions]="{ standalone: true }" (change)="applyFilter()">
                            <option value="all">All</option>
                            <option value="notified">Notified</option>
                            <option value="pending">Pending</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-2">
                    <div class="alert alert-light small mb-0">
                        Total absentees: <b>{{ filtered.length }}</b>
                    </div>
                    <button class="btn btn-sm btn-outline-primary" [disabled]="selectedIds.size===0"
                        (click)="openNotifyBulk()">
                        <i class="fa-solid fa-bullhorn me-1"></i>
                        Notify Selected ({{ selectedIds.size }})
                    </button>
                </div>
            </div>
            <!-- list-table -->
            <list-table [autoFitChars]="true" [columns]="columns" [data]="filtered" [actions]="actions">
            </list-table>
        </div>
    </div>

    <!-- Notify Modal -->
    <div class="app-modal-backdrop" *ngIf="showNotify">
        <div class="app-modal abs-notify-modal">
            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">Notify Absentees</h6>
                    <span class="text-muted small">
                        {{ notifyMode === 'single' ? 'Single' : 'Bulk' }} notification
                    </span>
                </div>
                <button class="btn-close" (click)="closeNotify()"></button>
            </div>
            <div class="app-modal-body">
                <div class="alert alert-warning small">
                    <b>Template:</b> “{{ templatePreview }}”
                </div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Channel</label>
                        <select class="form-select" [(ngModel)]="channel" [ngModelOptions]="{standalone:true}">
                            <option value="SMS">SMS</option>
                            <option value="WHATSAPP">WhatsApp</option>
                            <option value="EMAIL">Email</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label small text-muted">Message</label>
                        <textarea class="form-control" rows="3" [(ngModel)]="message"
                            [ngModelOptions]="{standalone:true}"></textarea>
                    </div>

                    <div class="col-12">
                        <div class="border rounded-3 p-2 bg-light-subtle">
                            <div class="small text-muted mb-1">Recipients</div>
                            <div class="small">
                                <ng-container *ngIf="notifyRecipients.length; else noneRec">
                                    <span class="badge bg-light text-muted me-1 mb-1"
                                        *ngFor="let r of notifyRecipients">
                                        {{ r.name }} ({{ r.parentPhone }})
                                    </span>
                                </ng-container>
                                <ng-template #noneRec>
                                    <span class="text-muted small">No recipients</span>
                                </ng-template>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button type="button" class="btn btn-outline-secondary" (click)="closeNotify()">Cancel</button>
                    <button type="button" class="btn btn-saffron" [disabled]="sending" (click)="sendNotify()">
                        Send
                        <i class="fa-solid fa-paper-plane ms-1"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
