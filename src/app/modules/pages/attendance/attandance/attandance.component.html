<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">

        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="fw-bold mb-0" style="font-size:30px;">
                <i class="fa-solid fa-clipboard-check me-2"></i>Attendance
            </h1>
            <span *ngIf="selectedDateLabel" class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2"
                style="font-size:0.85rem">
                {{ selectedDateLabel }}
            </span>
        </div>

        <!-- Week date picker -->
        <div class="row g-2 mb-4">
            <div class="col" *ngFor="let d of dates">
                <div class="date-card text-center rounded-3 py-2 px-1"
                    [class.date-card--active]="selectedDate === d.value"
                    [class.date-card--today]="d.value === getTodayUtcMs() && selectedDate !== d.value"
                    (click)="selectDate(d)" style="cursor:pointer; border: 1.5px solid #dee2e6;">
                    <div class="small fw-semibold" style="font-size:0.75rem; white-space:nowrap">
                        {{ d.label }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Pending periods table -->
        <div *ngIf="selectedDate">

            <!-- Loading -->
            <div *ngIf="loading" class="text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm me-2"></div>
                Loading periods...
            </div>

            <!-- No pending -->
            <div *ngIf="!loading && originalData.length === 0" class="text-center py-5 text-muted border rounded-3">
                <i class="fa-solid fa-circle-check fa-2x text-success opacity-50 mb-2 d-block"></i>
                <div class="fw-semibold">All attendance marked for this day</div>
                <div class="small mt-1">No pending periods found</div>
            </div>

            <!-- Table -->
            <div *ngIf="!loading && originalData.length > 0">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <span class="badge bg-warning-subtle text-warning border fw-semibold">
                        {{ totalRecords }} pending
                    </span>
                    <span class="text-muted small">Click <strong>Mark Attendance</strong> to record a period</span>
                </div>
                <list-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions"
                    [searchPlaceholder]="'Search batch, subject, faculty...'" [totalRecords]="totalRecords"
                    (requestData)="loadTableData($event)">
                </list-table>
            </div>
        </div>
    </div>
</div>
